set_override:
  name: Override setzen
  description: Aktiviert einen temporären Slot-Override mit einem bestimmten Preset für einen Zeitraum oder eine Dauer.
  fields:
    device_id:
      name: Gerät
      description: Smart Climate Scheduler Raum
      required: true
      selector:
        device:
          integration: smart_climate_scheduler
    override_id:
      name: Override ID
      description: Eindeutige ID für den Override (z. B. gaeste oder party). Optional.
      required: false
      selector:
        text: {}
    preset:
      name: Preset
      description: Das zu aktivierende Preset (z. B. comfort, boost, eco).
      required: true
      default: boost
      selector:
        select:
          translation_key: preset
          options:
            - none
            - home
            - away
            - boost
            - comfort
            - eco
            - sleep
            - activity
    duration:
      name: Dauer
      description: Dauer des Overrides (z. B. 1 Stunde, 30 Minuten). Wenn keine Startzeit angegeben ist, startet der Override sofort ab jetzt.
      required: false
      selector:
        duration: {}
    start:
      name: Startzeit
      description: Startzeitpunkt des Overrides (z. B. 14:00 oder ISO-Zeitstempel). Optional bei Angabe einer Dauer.
      required: false
      selector:
        time: {}
    end:
      name: Endzeit
      description: Endzeitpunkt des Overrides (z. B. 16:00 oder ISO-Zeitstempel). Optional bei Angabe einer Dauer.
      required: false
      selector:
        time: {}

remove_override:
  name: Override entfernen
  description: Hebt einen aktiven temporären Slot-Override vorzeitig auf.
  fields:
    device_id:
      name: Gerät
      description: Smart Climate Scheduler Raum
      required: true
      selector:
        device:
          integration: smart_climate_scheduler
    override_id:
      name: Override ID
      description: Die ID des zu entfernenden Overrides (z. B. gaeste oder party).
      required: true
      selector:
        text: {}

reset_heating_rates:
  name: Aufheizraten zurücksetzen
  description: Löscht alle gelernten Aufheizraten (Außentemperatur-Matrix & Gesamt-Durchschnitt) und setzt sie auf den konfigurierten Standardwert zurück.
  fields:
    device_id:
      name: Gerät
      description: Smart Climate Scheduler Raum
      required: true
      selector:
        device:
          integration: smart_climate_scheduler

set_manual_heating_rate:
  name: Aufheizrate manuell setzen
  description: Setzt den Gesamt-Durchschnitt der Aufheizrate (in K/h) manuell für diesen Raum.
  fields:
    device_id:
      name: Gerät
      description: Smart Climate Scheduler Raum
      required: true
      selector:
        device:
          integration: smart_climate_scheduler
    rate:
      name: Aufheizrate (K/h)
      description: Erwartete Aufheizrate in Kelvin/Stunde (°C/h). Z. B. 1.2 für einen schnell heizenden Raum oder 0.7 für Fußbodenheizung.
      required: true
      default: 1.0
      selector:
        number:
          min: 0.05
          max: 5.0
          step: 0.05
          unit_of_measurement: "K/h"
          mode: box

set_matrix_heating_rate:
  name: Matrix-Aufheizrate bearbeiten oder hinzufügen
  description: Fügt einen gezielten Wert für eine Außentemperatur zur Aufheizraten-Matrix hinzu oder überschreibt diesen direkt.
  fields:
    device_id:
      name: Gerät
      description: Smart Climate Scheduler Raum
      required: true
      selector:
        device:
          integration: smart_climate_scheduler
    temperature:
      name: Außentemperatur (°C)
      description: Die Außentemperatur für diesen Tabellen-Eintrag (z. B. -5, 0, 5, 12) oder "default".
      required: true
      default: "5"
      selector:
        text: {}
    rate:
      name: Aufheizrate (K/h)
      description: Aufheizrate in Kelvin pro Stunde (°C/h) für diese Außentemperatur.
      required: true
      default: 1.0
      selector:
        number:
          min: 0.05
          max: 5.0
          step: 0.05
          unit_of_measurement: "K/h"
          mode: box

delete_matrix_heating_rate:
  name: Matrix-Aufheizrate löschen
  description: Entfernt einen einzelnen Temperaturwert aus der gelernten Außentemperatur-Matrix.
  fields:
    device_id:
      name: Gerät
      description: Smart Climate Scheduler Raum
      required: true
      selector:
        device:
          integration: smart_climate_scheduler
    temperature:
      name: Außentemperatur (°C)
      description: Die Außentemperatur des zu entfernenden Eintrags (z. B. 5, -2) oder "default".
      required: true
      selector:
        text: {}

set_matrix_cooling_rate:
  name: Matrix-Abkühlrate bearbeiten oder hinzufügen
  description: Fügt einen gezielten Wert für eine Außentemperatur zur Abkühlraten-Matrix hinzu oder überschreibt diesen direkt.
  fields:
    device_id:
      name: Gerät
      description: Smart Climate Scheduler Raum
      required: true
      selector:
        device:
          integration: smart_climate_scheduler
    temperature:
      name: Außentemperatur (°C)
      description: Die Außentemperatur für diesen Tabellen-Eintrag (z. B. -5, 0, 5, 12) oder "default".
      required: true
      default: "5"
      selector:
        text: {}
    rate:
      name: Abkühlrate (K/h)
      description: Abkühlrate in Kelvin pro Stunde (°C/h) für diese Außentemperatur.
      required: true
      default: 0.2
      selector:
        number:
          min: 0.01
          max: 2.0
          step: 0.01
          unit_of_measurement: "K/h"
          mode: box

delete_matrix_cooling_rate:
  name: Matrix-Abkühlrate löschen
  description: Entfernt einen einzelnen Temperaturwert aus der gelernten Abkühlraten-Matrix.
  fields:
    device_id:
      name: Gerät
      description: Smart Climate Scheduler Raum
      required: true
      selector:
        device:
          integration: smart_climate_scheduler
    temperature:
      name: Außentemperatur (°C)
      description: Die Außentemperatur des zu entfernenden Eintrags (z. B. 5, -2) oder "default".
      required: true
      selector:
        text: {}