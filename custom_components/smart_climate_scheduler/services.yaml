set_override:
  name: Set Override
  description: Activates a temporary slot override with a specific preset for a period or duration.
  fields:
    device_id:
      name: Device
      description: Smart Climate Scheduler room
      required: true
      selector:
        device:
          integration: smart_climate_scheduler
    override_id:
      name: Override ID
      description: Unique ID for the override (e.g. guests or party). Optional.
      required: false
      selector:
        text: {}
    preset:
      name: Preset
      description: The preset to activate (e.g. comfort, boost, eco).
      required: true
      default: boost
      selector:
        select:
          translation_key: preset
          options:
            - none
            - home
            - away
            - boost
            - comfort
            - eco
            - sleep
            - activity
    duration:
      name: Duration
      description: Duration of the override (e.g. 1 hour, 30 minutes). Starts immediately if no start time is specified.
      required: false
      selector:
        duration: {}
    start:
      name: Start Time
      description: Start time of the override (e.g. 14:00 or ISO timestamp). Optional when duration is set.
      required: false
      selector:
        time: {}
    end:
      name: End Time
      description: End time of the override (e.g. 16:00 or ISO timestamp). Optional when duration is set.
      required: false
      selector:
        time: {}

remove_override:
  name: Remove Override
  description: Prematurely cancels an active temporary slot override.
  fields:
    device_id:
      name: Device
      description: Smart Climate Scheduler room
      required: true
      selector:
        device:
          integration: smart_climate_scheduler
    override_id:
      name: Override ID
      description: The ID of the override to remove (e.g. guests or party).
      required: true
      selector:
        text: {}

set_schedule_profile:
  name: Activate Schedule Profile
  description: Activates a specific schedule profile for one or all rooms.
  fields:
    device_id:
      name: Device
      description: Smart Climate Scheduler room
      required: true
      selector:
        device:
          integration: smart_climate_scheduler
    profile:
      name: Profile Name
      description: Name of the schedule profile to activate (e.g. Standard, Work, Vacation).
      required: true
      selector:
        text: {}

reset_heating_rates:
  name: Reset Heating Rates
  description: Deletes all learned heating rates (matrix & overall average) and resets to default values.
  fields:
    device_id:
      name: Device
      description: Smart Climate Scheduler room
      required: true
      selector:
        device:
          integration: smart_climate_scheduler

set_manual_heating_rate:
  name: Set Manual Heating Rate
  description: Manually sets the overall average heating rate (in K/h) for this room.
  fields:
    device_id:
      name: Device
      description: Smart Climate Scheduler room
      required: true
      selector:
        device:
          integration: smart_climate_scheduler
    rate:
      name: Heating Rate (K/h)
      description: Expected heating rate in Kelvin/hour (°C/h). E.g. 1.2 for fast heating or 0.7 for underfloor heating.
      required: true
      default: 1.0
      selector:
        number:
          min: 0.001
          max: 5.0
          step: 0.001
          unit_of_measurement: "K/h"
          mode: box

set_matrix_heating_rate:
  name: Set/Add Matrix Heating Rate
  description: Adds or updates an outdoor temperature heating rate bucket in the matrix.
  fields:
    device_id:
      name: Device
      description: Smart Climate Scheduler room
      required: true
      selector:
        device:
          integration: smart_climate_scheduler
    temperature:
      name: Outdoor Temperature (°C)
      description: The outdoor temperature for this bucket (e.g. -5, 0, 5, 12) or "default".
      required: true
      default: "5"
      selector:
        text: {}
    rate:
      name: Heating Rate (K/h)
      description: Heating rate in Kelvin per hour (°C/h) for this outdoor temperature.
      required: true
      default: 1.0
      selector:
        number:
          min: 0.001
          max: 5.0
          step: 0.001
          unit_of_measurement: "K/h"
          mode: box

delete_matrix_heating_rate:
  name: Delete Matrix Heating Rate
  description: Deletes an outdoor temperature heating rate entry from the matrix.
  fields:
    device_id:
      name: Device
      description: Smart Climate Scheduler room
      required: true
      selector:
        device:
          integration: smart_climate_scheduler
    temperature:
      name: Outdoor Temperature (°C)
      description: The outdoor temperature of the entry to delete (e.g. 5, -2) or "default".
      required: true
      selector:
        text: {}

set_matrix_cooling_rate:
  name: Set/Add Matrix Cooling Rate
  description: Adds or updates an outdoor temperature cooling rate bucket in the matrix.
  fields:
    device_id:
      name: Device
      description: Smart Climate Scheduler room
      required: true
      selector:
        device:
          integration: smart_climate_scheduler
    temperature:
      name: Outdoor Temperature (°C)
      description: The outdoor temperature for this bucket (e.g. -5, 0, 5, 12) or "default".
      required: true
      default: "5"
      selector:
        text: {}
    rate:
      name: Cooling Rate (K/h)
      description: Cooling rate in Kelvin per hour (°C/h) for this outdoor temperature.
      required: true
      default: 0.2
      selector:
        number:
          min: 0.001
          max: 2.0
          step: 0.001
          unit_of_measurement: "K/h"
          mode: box

delete_matrix_cooling_rate:
  name: Delete Matrix Cooling Rate
  description: Deletes an outdoor temperature cooling rate entry from the matrix.
  fields:
    device_id:
      name: Device
      description: Smart Climate Scheduler room
      required: true
      selector:
        device:
          integration: smart_climate_scheduler
    temperature:
      name: Outdoor Temperature (°C)
      description: The outdoor temperature of the entry to delete (e.g. 5, -2) or "default".
      required: true
      selector:
        text: {}